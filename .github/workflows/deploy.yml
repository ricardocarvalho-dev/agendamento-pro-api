name: Build, Test and Deploy

on:
  push:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  DOTNET_VERSION: '8.0.x'

jobs:
  build-test-deploy:
    runs-on: windows-latest
    
    strategy:
      matrix:
        include:
          - branch: develop
            environment: staging
            app-name: 'agendamentopro-api-ricardo-staging'
          - branch: main
            environment: production
            app-name: 'agendamentopro-api-ricardo'

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore dependencies
      run: dotnet restore AgendamentoPro.sln

    - name: Build
      run: dotnet build -c Release --no-restore

    - name: Run Tests
      run: dotnet test Tests/Tests.csproj -c Release --no-build --verbosity normal

    - name: Publish
      if: success()
      run: dotnet publish API/API.csproj -c Release -o ./publish -r win-x86 --self-contained false

    - name: Deploy to Azure
      if: success() && github.ref == format('refs/heads/{0}', matrix.branch)
      uses: azure/webapps-deploy@v2
      with:
        app-name: ${{ matrix.app-name }}
        publish-profile: ${{ secrets[format('AZURE_PUBLISH_PROFILE_{0}', matrix.environment)] }}
        package: ./publish